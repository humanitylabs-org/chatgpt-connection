# wizard-chatgpt: the main service is a small MCP front (mcp/front.py + mcp/tools.py, inlined by mcp/inline.py).
# It serves the app's MCP at /mcp and passes every other request unchanged to wizard-chatgpt-engine,
# the ChatGPT page and its /api/connection, which is reachable only on this app's private network.
services:
  wizard-chatgpt:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 128m
    environment:
      WIZARD_APP: wizard-chatgpt
      APP_VERSION: 0.3.0
      FRONT_PORT: "8801"
      UPSTREAM_HOST: wizard-chatgpt-engine
      UPSTREAM_PORT: "8801"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${APP_PORT}:8801"
    depends_on: [wizard-chatgpt-engine]
    command:
    - python
    - -c
    # BEGIN MCP FRONT (generated by mcp/inline.py)
    - |
      """Wizard MCP front: serves this app's MCP tools at /mcp and passes every other request,
      byte for byte, to the app behind it (HTTP, streaming and WebSockets alike).
      Stdlib only, so it runs on a stock python image with no build step.
      Generated from the app repo's mcp/ folder; edit there, then run mcp/inline.py."""
      import asyncio
      import contextvars
      import base64
      import json
      import os
      import socket
      import struct
      import time
      import urllib.parse
      import urllib.request
      import uuid

      APP = os.environ.get("WIZARD_APP", "app")
      VERSION = os.environ.get("APP_VERSION", "0")
      PORT = int(os.environ.get("FRONT_PORT", "8080"))
      UP_HOST = os.environ.get("UPSTREAM_HOST", "")
      UP_PORT = int(os.environ.get("UPSTREAM_PORT", str(PORT)))
      MCP_PATH = "/mcp"
      MCP_TOKEN = os.environ.get("MCP_TOKEN", "")  # when set, /mcp needs Authorization: Bearer <token>
      MAX_HEAD = 65536
      MAX_BODY = 1 << 20
      TOOLS = {}
      REQUEST = contextvars.ContextVar("request", default={})  # headers of the current /mcp call


      def tool(name, description, props=None, required=()):
          def deco(fn):
              schema = {"type": "object", "properties": props or {}, "required": list(required)}
              TOOLS[name] = ({"name": name, "description": description, "inputSchema": schema}, fn)
              return fn
          return deco


      def up_addr():
          try:
              return socket.gethostbyname(UP_HOST)
          except OSError:
              return UP_HOST


      def http(method, path, body=None, headers=None, timeout=60):
          url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          with urllib.request.urlopen(req, timeout=timeout) as r:
              return r.status, r.read()


      def err(i, code, message):
          return {"jsonrpc": "2.0", "id": i, "error": {"code": code, "message": message}}


      def rpc(msg):
          m, i, p = msg.get("method"), msg.get("id"), msg.get("params") or {}
          if m == "initialize":
              r = {"protocolVersion": p.get("protocolVersion", "2025-06-18"), "capabilities": {"tools": {}},
                   "serverInfo": {"name": APP, "version": VERSION}}
          elif m == "tools/list":
              r = {"tools": [t[0] for t in TOOLS.values()]}
          elif m == "tools/call":
              name, args = p.get("name"), p.get("arguments") or {}
              if name not in TOOLS:
                  return err(i, -32602, "unknown tool %s" % name)
              try:
                  out = TOOLS[name][1](**args)
                  if isinstance(out, dict) and "_content" in out:
                      r = {"content": out["_content"]}
                  else:
                      text = out if isinstance(out, str) else json.dumps(out, indent=2)
                      r = {"content": [{"type": "text", "text": text[:200000]}]}
              except Exception:  # upstream errors may contain URLs, headers or secrets
                  # Never return upstream exception text to the model.
                  r = {"content": [{"type": "text", "text": "Connection request failed."}], "isError": True}
          elif m == "ping":
              r = {}
          elif i is None:
              return None  # notification
          else:
              return err(i, -32601, "unknown method %s" % m)
          return {"jsonrpc": "2.0", "id": i, "result": r}


      REASONS = {200: "OK", 202: "Accepted", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed",
                 401: "Unauthorized", 413: "Payload Too Large", 502: "Bad Gateway"}


      async def respond(writer, code, obj=None, extra=""):
          body = b"" if obj is None else json.dumps(obj).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n%s\r\n" % (
              code, REASONS.get(code, "OK"), len(body), extra)
          writer.write(head.encode() + body)
          try:
              await writer.drain()
          finally:
              writer.close()


      async def mcp(reader, writer, method, rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          if MCP_TOKEN:
              import hmac
              if not hmac.compare_digest(headers.get("authorization", "").encode(), ("Bearer " + MCP_TOKEN).encode()):
                  return await respond(writer, 401, {"error": "this MCP needs Authorization: Bearer <token>"}, 'WWW-Authenticate: Bearer\r\n')
          if method != "POST":
              return await respond(writer, 405, {"error": "use POST %s" % MCP_PATH}, "Allow: POST\r\n")
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          try:
              msg = json.loads(body or b"{}")
          except ValueError:
              return await respond(writer, 400, err(None, -32700, "parse error"))
          REQUEST.set(headers)
          batch = msg if isinstance(msg, list) else [msg]
          results = await asyncio.gather(*(asyncio.to_thread(rpc, x) for x in batch if isinstance(x, dict)))
          out = [x for x in results if x]
          if not out:
              return await respond(writer, 202)
          await respond(writer, 200, out if isinstance(msg, list) else out[0])


      async def pipe(r, w):
          try:
              while True:
                  data = await r.read(65536)
                  if not data:
                      break
                  w.write(data)
                  await w.drain()
          except (ConnectionError, OSError):
              pass
          finally:
              try:
                  w.close()
              except Exception:
                  pass


      async def handle(reader, writer):
          try:
              head = await reader.readuntil(b"\r\n\r\n")
          except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError):
              writer.close()
              return
          line, _, rest = head.partition(b"\r\n")
          parts = line.decode("latin-1").split(" ")
          path = parts[1].split("?", 1)[0] if len(parts) >= 3 else ""
          if path == MCP_PATH:
              return await mcp(reader, writer, parts[0], rest)
          if not UP_HOST:
              return await respond(writer, 404, {"error": "not found"})
          try:
              ur, uw = await asyncio.open_connection(UP_HOST, UP_PORT)
          except OSError:
              return await respond(writer, 502, {"error": "%s is starting or not reachable" % APP})
          # One request per proxied connection (unless it is an upgrade such as a WebSocket), so a
          # later /mcp request can never ride an upstream keep-alive connection.
          lines = head.decode("latin-1").split("\r\n")
          if not any(l.lower().startswith("upgrade:") for l in lines):
              lines = [l for l in lines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              head = ("\r\n".join(lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1")
          uw.write(head)
          await uw.drain()
          await asyncio.gather(pipe(reader, uw), pipe(ur, writer))


      async def main():
          srv = await asyncio.start_server(handle, "0.0.0.0", PORT, limit=MAX_HEAD)
          async with srv:
              await srv.serve_forever()


      # ---- tools for this app ----
      # Read-only by design: connecting, switching and disconnecting are owner actions on the ChatGPT page.
      # The MCP reports app-owned wizard.ai-connection/2 status and usage, never a token.
      # Box-only: a call that came through Tailscale Serve, a tunnel or a proxy is refused; agents reach this
      # MCP on the app network (http://wizard-chatgpt:8801/mcp), which adds none of these headers.

      PROXY_HEADERS = ("tailscale-user-login", "x-forwarded-for", "forwarded", "x-real-ip")


      @tool("connection_status", "ChatGPT subscription status on this Wizard: connected / not_connected / expired / error, "
            "plan and usage from the app-owned login, and an error message that says what to do. "
            "Read-only; never returns a token.")
      def connection_status():
          if any(k in PROXY_HEADERS or k in ("origin", "referer", "cookie", "via") or (k.startswith(("cf-", "x-forwarded-", "sec-fetch-")) and k != "sec-fetch-mode") for k in REQUEST.get()):
              raise PermissionError("box-only: call this MCP from the server (app network), not through the tailnet or a proxy")
          headers = {}
          auth = REQUEST.get().get("authorization")
          if auth:
              headers["Authorization"] = auth  # the page password (Basic), forwarded unchanged
          _, raw = http("GET", "/api/connection", None, headers, timeout=15)
          d = json.loads(raw)
          if d.get("status") == "not_connected":
              d["next"] = ("Ask the owner to open the ChatGPT app, press Connect, open the ChatGPT link and enter the code "
                           "shown. Never ask for the code or a token in chat.")
          elif d.get("status") in ("error", "expired"):
              d["next"] = "Tell the owner error.message; reconnect in this app when expired, never in Hermes."
          return d


      if __name__ == "__main__":
          asyncio.run(main())
    # END MCP FRONT
    x-runtipi:
      is_main: true
      internal_port: 8801
  # BEGIN PRIVATE DATA INITIALIZATION
  # Explicit image/recipe runtime identity: 1000:1000, never manager UID guessing.
  wizard-chatgpt-data-init:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    x-runtipi:
      wizard_grants: false
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - python3
      - -c
      - &private_data_code |
          RECIPE_ROOT = '/data'
          """Create-only mount preparation; metadata-only validation runs without root/caps.

          Generated into Compose by tools/inline-private-data.py. No credential bytes read.
          """
          import os
          import stat
          import sys

          DIRECTORY = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          PATH_DIRECTORY = os.O_PATH | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC


          def open_directory(path):
              # Resolve every component with nofollow, not only the last component.
              if not path.startswith('/') or path == '/' or path != os.path.normpath(path):
                  raise ValueError('Private storage initialization refused.')
              parts = path[1:].split('/')
              if any(part in ('', '.', '..') for part in parts):
                  raise ValueError('Private storage initialization refused.')
              fd = os.open('/', PATH_DIRECTORY)
              try:
                  for part in parts:
                      child = os.open(part, PATH_DIRECTORY, dir_fd=fd)
                      os.close(fd)
                      fd = child
                  return fd
              except BaseException:
                  os.close(fd)
                  raise


          def prepare(path, uid, gid):
              """Only empty 0:0 roots change; existing runtime ownership is untouched."""
              handle = open_directory(path)
              try:
                  before = os.fstat(handle)
                  if (before.st_uid, before.st_gid) == (uid, gid):
                      return
                  if (before.st_uid, before.st_gid) != (0, 0):
                      raise ValueError('Private storage initialization refused.')
                  fd = os.open('.', DIRECTORY, dir_fd=handle)
                  try:
                      if os.listdir(fd):
                          raise ValueError('Private storage initialization refused.')
                      # No FOWNER required: set mode while this inode is still root-owned.
                      original_mode = stat.S_IMODE(before.st_mode)
                      os.fchmod(fd, 0o700)
                      try:
                          os.fchown(fd, uid, gid)
                      except BaseException:
                          # A failed handoff leaves the original empty root's mode intact.
                          after = os.fstat(fd)
                          if (after.st_uid, after.st_gid) == (0, 0):
                              os.fchmod(fd, original_mode)
                          raise
                      os.fsync(fd)
                  finally:
                      os.close(fd)
              finally:
                  os.close(handle)


          def validate(path, uid, gid):
              """Run as exactly uid:gid, no added capabilities; never chmod/chown/read files."""
              if (os.geteuid(), os.getegid()) != (uid, gid):
                  raise ValueError('Private storage validation refused.')
              handle = open_directory(path)
              try:
                  device = os.fstat(handle).st_dev

                  def inspect(fd, depth=0):
                      if depth > 64:
                          raise ValueError('Private storage validation refused.')
                      info = os.fstat(fd)
                      if ((info.st_uid, info.st_gid) != (uid, gid) or info.st_dev != device
                              or not stat.S_ISDIR(info.st_mode)):
                          raise ValueError('Private storage validation refused.')
                      directory = os.open('.', DIRECTORY, dir_fd=fd)
                      try:
                          for name in os.listdir(directory):
                              child = os.open(name, os.O_PATH | os.O_NOFOLLOW | os.O_CLOEXEC,
                                              dir_fd=directory)
                              try:
                                  item = os.fstat(child)
                                  if ((item.st_uid, item.st_gid) != (uid, gid)
                                          or item.st_dev != device):
                                      raise ValueError('Private storage validation refused.')
                                  if stat.S_ISDIR(item.st_mode):
                                      inspect(child, depth + 1)
                                  elif not stat.S_ISREG(item.st_mode) or item.st_nlink != 1:
                                      raise ValueError('Private storage validation refused.')
                              finally:
                                  os.close(child)
                      finally:
                          os.close(directory)

                  inspect(handle)
              finally:
                  os.close(handle)


          def main():
              # Fixed recipe contract, not a caller-selected host path or UID fallback.
              path, uid, gid = RECIPE_ROOT, 1000, 1000
              try:
                  if sys.argv[1:] == ['prepare']:
                      prepare(path, uid, gid)
                  elif sys.argv[1:] == ['validate']:
                      validate(path, uid, gid)
                  else:
                      raise ValueError('Private storage initialization refused.')
              except (OSError, ValueError):
                  raise SystemExit('Private storage initialization refused; ownership/migration review required.') from None


          if __name__ == '__main__':
              main()
      - prepare
  wizard-chatgpt-data-validate:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    x-runtipi:
      wizard_grants: false
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    depends_on:
      wizard-chatgpt-data-init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data:ro
    command: [python3, -c, *private_data_code, validate]
  # END PRIVATE DATA INITIALIZATION
  wizard-chatgpt-engine:
    # Source package: execute the exact installed repo revision, not the old custom image.
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    working_dir: /app
    command: ["python3", "/app/server.py"]
    depends_on:
      wizard-chatgpt-data-validate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    # One admitted image upload: up to 16 x 25 MiB plus base64/JSON copies.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 0.5
    environment:
      WIZARD_CHATGPT_PORT: "8801"
      WIZARD_CHATGPT_PASSWORD: ${WIZARD_CHATGPT_PASSWORD:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      WIZARD_CHATGPT_AGENT_URL: ${WIZARD_CHATGPT_AGENT_URL:-http://wizard-chatgpt:8801/v1}
      # Dashboard access is used ONLY to register a box-local bearer, never for OAuth or inference.
      WIZARD_CHATGPT_HERMES_URL: ${WIZARD_CHATGPT_HERMES_URL:-http://hermes-agent:9119}
      WIZARD_CHATGPT_HERMES_USER: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-hermes}
      WIZARD_CHATGPT_HERMES_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
    volumes:
      - ${APP_SOURCE_DIR}:/app:ro
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      # Joins the Runtipi main network so it can reach the Hermes Agent app by name.
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
